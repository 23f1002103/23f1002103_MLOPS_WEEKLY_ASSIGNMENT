name: CD - Build, Deploy and Stress Test

on:
  push:
    branches: [week_7]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/927061930480/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '927061930480-compute@developer.gserviceaccount.com'

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/project-b38b370e-25fb-420a-a54/iris-repo/iris-api:latest .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/project-b38b370e-25fb-420a-a54/iris-repo/iris-api:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: iris-cluster
          location: us-central1-a
          project_id: project-b38b370e-25fb-420a-a54

      - name: Deploy to GKE
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl rollout status deployment/iris-deployment

      - name: Apply HPA
        run: |
          kubectl apply -f hpa.yaml

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Wait for external IP
        run: |
          echo "Waiting for LoadBalancer IP..."
          for i in {1..20}; do
            IP=$(kubectl get service iris-deployment --template='{{range .status.loadBalancer.ingress}}{{.ip}}{{end}}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "EXTERNAL_IP=$IP" >> $GITHUB_ENV
              echo "Got IP: $IP"
              break
            fi
            echo "Waiting... attempt $i"
            sleep 15
          done

      - name: Run stress test
        run: |
          echo "Running wrk stress test against http://$EXTERNAL_IP/predict"
          wrk -t4 -c1000 -d30s http://$EXTERNAL_IP/predict
