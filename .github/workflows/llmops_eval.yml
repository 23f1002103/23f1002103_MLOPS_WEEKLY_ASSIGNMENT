name: LLMOps Evaluation - Week 10

on:
  push:
    branches: [week_10]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/927061930480/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'iris-github-sa@project-b38b370e-25fb-420a-a54.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-httplib2 requests pandas scikit-learn

      - name: Run LLM Evaluation
        run: |
          python evaluate_llm.py
