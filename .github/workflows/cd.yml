name: CD - Build and Deploy to GKE

on:
  push:
    branches: [week_6]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/927061930480/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '927061930480-compute@developer.gserviceaccount.com'

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/project-b38b370e-25fb-420a-a54/iris-repo/iris-api:latest .

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/project-b38b370e-25fb-420a-a54/iris-repo/iris-api:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: iris-cluster
          location: us-central1
          project_id: project-b38b370e-25fb-420a-a54

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/iris-deployment iris-api=us-central1-docker.pkg.dev/project-b38b370e-25fb-420a-a54/iris-repo/iris-api:latest
          kubectl rollout status deployment/iris-deployment
