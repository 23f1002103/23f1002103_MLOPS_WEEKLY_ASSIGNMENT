name: ML CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/927061930480/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '927061930480-compute@developer.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install dvc dvc-gs pandas scikit-learn joblib pytest mlflow

      - name: Pull data via DVC (data only, no model)
        run: dvc pull data/v1data.csv data/v2data.csv

      - name: Run tests (model fetched from MLflow Registry)
        env:
          MLFLOW_TRACKING_URI: http://34.135.49.194:5000
        run: pytest test_model.py -v | tee pytest_output.txt

      - name: Build report
        if: always()
        run: |
          echo "## CI Test Report" > report.md
          echo "" >> report.md
          echo "### Test Results" >> report.md
          echo '```' >> report.md
          cat pytest_output.txt >> report.md || echo "No test output available" >> report.md
          echo '```' >> report.md
          echo "" >> report.md
          echo "### Model Metrics" >> report.md
          python format_metrics.py >> report.md

      - name: Setup CML
        if: always()
        uses: iterative/setup-cml@v2

      - name: Comment on PR
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md
